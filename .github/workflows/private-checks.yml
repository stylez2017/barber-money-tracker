name: Private app checks

# This workflow deliberately cannot deploy or enable any URL.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check private configuration
        run: node scripts/check-private-config.mjs
      - run: npm test
      - run: npm run test:timezones
      - run: npm run test:tooling
      - run: npm run build:cloudflare
      - run: npm run typecheck
      - name: Validate Worker bundle without uploading
        run: npm run check:cloudflare
